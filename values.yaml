renovate:
  redis:
    enabled: true
    # Bitnami removed its versioned images from docker.io/bitnami.
    # The image referenced by this chart version only exists in bitnamilegacy.
    image:
      repository: bitnamilegacy/redis

  renovate:
    config: |
      {
        "autodiscover": true,
        "onboardingConfig": {
          "$schema": "https://docs.renovatebot.com/renovate-schema.json",
          "extends": [
            "config:recommended",
            ":dependencyDashboard"
          ],
          "postUpdateOptions": [
            "helmUpdateSubChartArchives"
          ]
        }
      }

  resources:
    limits:
      cpu: 1000m
      memory: 768Mi
    requests:
      cpu: 600m
      memory: 512Mi
